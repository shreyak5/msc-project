# Smoke-test variant of stage2.yaml (implementation-plan.md Sec 7) - for
# validating the multi-node SLURM/DDP launch mechanics (slurm_jobs/
# stage2_smoke_test.sh) cheaply and quickly, not for real training. Same real
# dataloader/dataset pipeline as the real config, just num_steps trimmed way
# down and log_interval_steps=1 so every step prints immediately.
#
# num_steps=6 (not 5, unlike pretrain_smoke.yaml) deliberately gives exactly 2
# full cycles of pass_pattern [A, B, C] - Stage 2's round-robin scheduler and
# its two independently-cycling loaders (frame_pool for A/B, clip for C) are
# real added complexity pretrain.py doesn't have, so the smoke test should
# actually exercise Pass C (the video/TemporalTransformer path) at least
# twice, not just once.
#
# stage1_checkpoint_pth points at the real pretrain_smoke_test.sh run's own
# checkpoint (confirmed to exist and load correctly) rather than the real
# pretrain.yaml's still-placeholder path, so this smoke test doesn't need a
# real, fully-trained Stage 1 checkpoint to exist yet.
seed: 42
learning_rate: 0.0001
num_steps: 6
log_interval_steps: 1
checkpoint_interval_steps: 1000
device: cuda
checkpoint_dir: /projects/u6kf/sk3925_misc/checkpoints/stage2_smoke_test
stage1_checkpoint_pth: /projects/u6kf/sk3925_misc/checkpoints/pretrain/step_00059999.pt
dataloader_config_path: dataset_processing/config/dataloader.yaml
pass_pattern: [A, B, C]
pass_b_alternation_period: 1
