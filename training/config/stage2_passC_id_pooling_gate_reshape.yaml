# Pass C identity-pooling + gate-reshaping experiment: exact copy of
# stage2_passC_id_pooling.yaml, plus switching Change 2's vertex-space gate
# (model/losses/temporal_smoothness.py's compute_vertex_gate) from the
# original "min_vis" formula to the better-calibrated "delta_vis" one - gates
# on the frame-to-frame CHANGE in visibility rather than its absolute level,
# targeting occlusion onset/offset specifically. vertex_gate_delta_cap: 0.1 is
# roughly the global p95 frame-to-frame visibility diff measured across
# csl_daily/how2sign/phoenix2014t; vertex_gate_delta_beta: 1.5 sharpens the
# separation between genuine transitions and ordinary jitter without
# over-thinning how many frame pairs contribute signal per batch (see
# stage2-config-reference.md for the measured gate-value distributions this
# was picked from). Own checkpoint_dir/wandb_run_name (passC_id_pooling_gate_
# reshape) so this never collides with the existing passC_occlusion_exp* or
# passC_id_pooling runs.
seed: 42
learning_rate: 0.00001
num_steps: 10000
log_interval_steps: 51
checkpoint_interval_steps: 1000
device: cuda
checkpoint_dir: /projects/u6ga/sk3925_misc/checkpoints/passC_id_pooling_gate_reshape
stage1_checkpoint_pth: /projects/u6ga/sk3925_misc/checkpoints/pretrain/step_00059999.pt
dataloader_config_path: dataset_processing/config/dataloader.yaml
datasets_yaml_path: dataset_processing/config/datasets_sign_language_only.yaml
pass_pattern: [A, C]
warmup_steps: 1000
checkpoint_pth: /projects/u6ga/sk3925_misc/checkpoints/stage2_A/step_00007999.pt
resume_optimizer_and_step: false
pass_c_synthetic_occlusion_enabled: false
landmark_occlusion_masking: true
expressive_region_smooth_weight: 3.0
temporal_vertex_smoothness_weight: 5000
param_smoothness_in_pass_c: false
mouth_gate_use_region_visibility: false
pass_c_identity_pooling: true
vertex_gate_mode: delta_vis
vertex_gate_delta_cap: 0.1
vertex_gate_delta_beta: 1.5
tt_variant: gated
tt_gamma: 3.0
wandb_run_name: passC_id_pooling_gate_reshape

