# 50-expression-dim variant of stage2_AB_copy.yaml: pass_b_encoder_steps=100
# (a 100:1 encoder:unet ratio in Pass B's own internal alternation).
#
# checkpoint_dir now a _v3_exp suffix, one-off experiment on this line only
# (the sibling 50/100-dim lines stay on their own _v4 checkpoints, untouched;
# named _v3_exp since it reuses _v3's regularization value but isn't itself
# _v3 - it also carries the two new weight changes below) - combines:
# REG_EXPRESSION_WEIGHT back down to 5e-3 (the _v3 value - _v4's
# 1e-3 was judged fine but this explicitly requests testing 5e-3 together
# with the two new weight changes below, rather than 1e-3), plus
# IDENTITY_CYCLE_LOSS_WEIGHT 1.0->10.0 and EMOTION_LOSS_WEIGHT 1.0->2.0 (both
# new, first tried here - see their own comments in model/constants.py).
# REG_EXPRESSION_WEIGHT is a GLOBAL constant, not scoped per-run: setting it
# to 5e-3 for this experiment also changes the default for any future run,
# including a future resume of the sibling _v4 lines (currently sitting at
# 1e-3) - would need to be flipped back to 1e-3 first if those are resumed
# before this one-off experiment is done. Restarted (not resumed) from
# stage2_50_unet_warmup's checkpoint for a clean comparison. Every prior
# version's checkpoints are left on disk, untouched.
seed: 42
learning_rate: 0.00001
num_steps: 100000
log_interval_steps: 50
checkpoint_interval_steps: 1000
device: cuda
checkpoint_dir: /projects/u6ga/sk3925_misc/checkpoints/stage2_50_AAB_UNet100_v3_exp
stage1_checkpoint_pth: /projects/u6ga/sk3925_misc/checkpoints/pretrain_50/step_00059999.pt
checkpoint_pth: /projects/u6ga/sk3925_misc/checkpoints/stage2_50_unet_warmup/step_00007999.pt
dataloader_config_path: dataset_processing/config/dataloader.yaml
num_expression_params: 50
pass_pattern: [A, A, B]
pass_b_encoder_steps: 100
pass_b_unet_steps: 1
pass_b_joint_steps: 0
warmup_steps: 1000
wandb_project: msc-project-pretrain-50
resume_optimizer_and_step: false
