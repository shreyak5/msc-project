# Smoke-test variant of pretrain_50.yaml, mirroring pretrain_smoke.yaml's own
# purpose exactly (cheap, fast validation of the multi-node SLURM/DDP launch
# mechanics via slurm_jobs/pretrain_50_smoke_test.sh - not real training) but at
# num_expression_params=50, so it also exercises the configurable-expression-dim
# path itself (52-wide expression head, FLAME sliced to 50 PCA components,
# checkpoint save/load with the new num_expression_params metadata) before the
# real 4-node/16-GPU/24h pretrain_50.sh job is submitted.
seed: 42
learning_rate: 0.0001
num_steps: 5
log_interval_steps: 1
checkpoint_interval_steps: 1000
device: cuda
checkpoint_dir: /projects/u6ga/sk3925_misc/checkpoints/pretrain_50_smoke_test
dataloader_config_path: dataset_processing/config/dataloader.yaml
num_expression_params: 50
wandb_project: msc-project-pretrain-50
