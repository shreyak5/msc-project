# Pass C smoothness-boost experiment: sibling of
# stage2_passC_occlusion_subset_smoothness_10k.yaml (see that file's own
# comment for the full rationale) with larger weights -
# temporal_vertex_smoothness_weight: 5000 -> 15000 (3x), and
# temporal_velocity_weight_in_pass_c: 1.5 (15x the default 0.1). Projected
# (static, real-data-measured) combined smoothness share: vertex_smooth
# ~18.9% + param_vel ~16.9% =~ 36% of the total Pass C loss, vs. ~9% today -
# see this session's own loss-fraction analysis for the full projection
# table. Shares slurm_jobs/stage2_passC_occlusion_subset_smoothness.sh with
# the 10k sibling (config path is a script argument, not hardcoded).
# Own checkpoint_dir/wandb_run_name (passC_occlusion_subset_smoothness_15k).
seed: 42
learning_rate: 0.00001
num_steps: 10000
log_interval_steps: 51
checkpoint_interval_steps: 1000
device: cuda
checkpoint_dir: /projects/u6ga/sk3925_misc/checkpoints/passC_occlusion_subset_smoothness_15k
stage1_checkpoint_pth: /projects/u6ga/sk3925_misc/checkpoints/pretrain/step_00059999.pt
dataloader_config_path: dataset_processing/config/dataloader.yaml
datasets_yaml_path: dataset_processing/config/datasets_sign_language_only.yaml
pass_pattern: [A, C]
warmup_steps: 1000
checkpoint_pth: /projects/u6ga/sk3925_misc/checkpoints/stage2_A/step_00007999.pt
resume_optimizer_and_step: false
pass_c_synthetic_occlusion_enabled: false
landmark_occlusion_masking: true
expressive_region_smooth_weight: 3.0
temporal_vertex_smoothness_weight: 15000
param_smoothness_in_pass_c: true
temporal_velocity_weight_in_pass_c: 1.5
mouth_gate_use_region_visibility: false
pass_c_identity_pooling: true
vertex_gate_mode: delta_vis
vertex_gate_delta_cap: 0.1
vertex_gate_delta_beta: 1.5
pass_c_occlusion_subset_index_dir: dataset_processing/occlusion_clip_index
tt_variant: gated
tt_gamma: 3.0
wandb_run_name: passC_occlusion_subset_smoothness_15k

